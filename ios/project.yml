name: Recall
options:
  bundleIdPrefix: com.speedhacks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Recall.xcconfig
  Release: Config/Recall.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Recall:
    type: application
    platform: iOS
    sources:
      - path: Recall
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: Recall/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(RECALL_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: $(RECALL_ENTITLEMENTS)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(RECALL_TEAM)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
  RecallTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecallTests]
    dependencies:
      - target: Recall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(RECALL_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Recall.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Recall
        BUNDLE_LOADER: $(TEST_HOST)
        DEVELOPMENT_TEAM: $(RECALL_TEAM)
  RecallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RecallUITests]
    dependencies:
      - target: Recall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(RECALL_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Recall
        DEVELOPMENT_TEAM: $(RECALL_TEAM)
schemes:
  Recall:
    build:
      targets:
        Recall: all
        RecallTests: [test]
        RecallUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecallTests
        - RecallUITests
