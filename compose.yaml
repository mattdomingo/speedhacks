# Local stack: Postgres plus the backend. Production runs on Vercel with a Neon database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: speedhacks
      POSTGRES_PASSWORD: speedhacks
      POSTGRES_DB: speedhacks
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedhacks -d speedhacks"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://speedhacks:speedhacks@postgres:5432/speedhacks
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  postgres-data:
