name: Scaffold checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: speedhacks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d speedhacks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run keewano:codegen -- --check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/speedhacks_test
      - run: python -m unittest discover -s camera -p 'test_*.py'
